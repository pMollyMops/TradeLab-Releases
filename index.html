<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeLab – Download</title>
<meta name="description" content="TradeLab – Trading-Journal mit Risikomanagement vor dem Trade. Download für Windows, macOS und Linux, Anleitung und Demo.">
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #f5f8fb; --card: #ffffff; --text: #16202a; --muted: #5b6875; --border: #dbe4ec;
    --brand: #1870b0; --brand-2: #1e9ad6; --brand-soft: #eef5fb; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151b; --card: #161f27; --text: #e6edf3; --muted: #9aa8b5; --border: #26333f;
            --brand: #3a95d6; --brand-2: #4fb4e6; --brand-soft: #182836; --ok: #3fbf6f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-bottom: 8px; }
  header img { width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; }
  h1 { margin: 0; font-size: 2rem; color: var(--brand); letter-spacing: .01em; }
  .tagline { margin: 2px 0 0; color: var(--muted); }
  .lang { margin-left: auto; align-self: flex-start; display: flex; gap: 4px; }
  .lang button { border: 1px solid var(--border); background: var(--card); color: var(--muted);
                 padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: .85rem; }
  .lang button[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); font-weight: 600; }
  .version { display: inline-block; margin: 18px 0 22px; padding: 4px 12px; border-radius: 999px;
             background: var(--brand-soft); color: var(--brand); font-size: .9rem; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }
  .card.primary { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
         padding: 11px 14px; border-radius: 8px; text-decoration: none; font-weight: 600;
         background: var(--brand); color: #fff; border: 1px solid var(--brand); }
  .btn:hover { background: var(--brand-2); border-color: var(--brand-2); }
  .btn.secondary { background: transparent; color: var(--brand); }
  .btn.secondary:hover { background: var(--brand-soft); }
  .card .btn + .btn { margin-top: 8px; }
  .alt { display: block; margin-top: 6px; font-size: .82rem; text-align: center; color: var(--brand); }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { border: 1px solid var(--border); background: var(--card); color: var(--muted);
                 padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: .9rem; }
  .tabs button[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); font-weight: 600; }
  code { font-size: .88em; background: var(--brand-soft); padding: 1px 5px; border-radius: 4px; }
  .note { margin-top: 10px; font-size: .82rem; color: var(--muted); text-align: center; }
  section { margin-top: 32px; }
  section h2 { font-size: 1.25rem; margin: 0 0 10px; }
  .docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; }
  ol { padding-left: 1.3em; margin: 0; }
  ol li { margin-bottom: 6px; }
  .box { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--brand);
         border-radius: 8px; padding: 14px 16px; }
  .facts { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .facts li::before { content: "✓"; color: var(--ok); font-weight: 700; margin-right: 8px; }
  footer { margin-top: 40px; font-size: .85rem; color: var(--muted); text-align: center; }
  footer a, .box a { color: var(--brand); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="">
    <div>
      <h1>TradeLab</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <span class="version" id="version" data-i18n="loading"></span>

  <div class="cards">
    <div class="card primary">
      <h2 data-i18n="fullTitle"></h2>
      <p data-i18n="fullText"></p>
      <a class="btn" id="full-win" href="https://github.com/pMollyMops/TradeLab-Releases/releases/latest" data-i18n="winBtn"></a>
      <a class="btn secondary" id="full-mac" hidden data-i18n="macBtn"></a>
      <a class="btn secondary" id="full-linux" hidden data-i18n="linuxBtn"></a>
      <a class="alt" id="full-deb" hidden data-i18n="debLink"></a>
    </div>
    <div class="card">
      <h2 data-i18n="demoTitle"></h2>
      <p data-i18n="demoText"></p>
      <a class="btn secondary" id="demo-win" href="https://github.com/pMollyMops/TradeLab-Releases/releases/latest" data-i18n="winBtn"></a>
      <a class="btn secondary" id="demo-mac" hidden data-i18n="macBtn"></a>
      <a class="btn secondary" id="demo-linux" hidden data-i18n="linuxBtn"></a>
      <a class="alt" id="demo-deb" hidden data-i18n="debLink"></a>
    </div>
  </div>
  <p class="note" id="soon-note" hidden></p>

  <section>
    <h2 data-i18n="docsTitle"></h2>
    <div class="docs">
      <a class="btn secondary" href="TradeLab_Anleitung_DE.pdf">📘 Anleitung (Deutsch, PDF)</a>
      <a class="btn secondary" href="TradeLab_Guide_EN.pdf">📘 Guide (English, PDF)</a>
    </div>
  </section>

  <section>
    <h2 data-i18n="firstTitle"></h2>
    <div class="tabs" role="group" aria-label="System">
      <button type="button" data-os="win">Windows</button>
      <button type="button" data-os="linux">Linux</button>
    </div>
    <div class="box" data-os-box="win">
      <ol>
        <li data-i18n="first1"></li>
        <li data-i18n="first2"></li>
        <li data-i18n="first3"></li>
      </ol>
    </div>
    <div class="box" data-os-box="linux" hidden>
      <ol>
        <li data-i18n-html="linux1"></li>
        <li data-i18n-html="linux2"></li>
        <li data-i18n-html="linux3"></li>
        <li data-i18n-html="linux4"></li>
      </ol>
    </div>
  </section>

  <section>
    <h2 data-i18n="factsTitle"></h2>
    <ul class="facts">
      <li data-i18n="fact1"></li>
      <li data-i18n="fact2"></li>
      <li data-i18n="fact3"></li>
      <li data-i18n="fact4"></li>
    </ul>
  </section>

  <footer>
    <span data-i18n="footer"></span>
    · <a href="https://github.com/pMollyMops/TradeLab-Releases/releases" data-i18n="allVersions"></a>
  </footer>
</main>

<script>
const REPO = "pMollyMops/TradeLab-Releases";
const T = {
  de: {
    tagline: "Trading-Journal mit Risikomanagement – vor dem Trade.",
    loading: "Aktuelle Version wird geladen …",
    version: (v, d) => `Aktuelle Version ${v} · ${d}`,
    versionFail: "Version konnte nicht geladen werden – die Knöpfe führen zur Release-Seite.",
    fullTitle: "TradeLab",
    fullText: "Die Vollversion: startet leer, du legst deine eigenen Konten und Trades an. Ohne Limit.",
    demoTitle: "TradeLab-Demo",
    demoText: "Zum Ausprobieren: über 1.000 Beispiel-Trades sind schon drin. Max. 10 eigene neue Trades pro Monat.",
    winBtn: "⬇ Für Windows herunterladen",
    macBtn: "⬇ Für macOS herunterladen",
    linuxBtn: "⬇ Für Linux herunterladen (AppImage)",
    debLink: "oder als .deb-Paket (Debian/Ubuntu, ohne Auto-Update)",
    soon: (os) => `Die Version für ${os} folgt in Kürze.`,
    docsTitle: "Anleitung",
    firstTitle: "Erster Start",
    first1: "Die heruntergeladene Datei per Doppelklick starten – Administratorrechte sind nicht nötig.",
    first2: "Erscheint „Der Computer wurde durch Windows geschützt“: auf „Weitere Informationen“ und dann „Trotzdem ausführen“ klicken. Die Warnung kommt, weil die App (noch) kein kostenpflichtiges Herausgeber-Zertifikat hat.",
    first3: "Fertig – TradeLab startet über das Startmenü. Wie es weitergeht, steht in der Anleitung.",
    linux1: "Die <b>AppImage</b> an einen festen Ort legen, z.B. <code>~/Programme</code> – von dort aus aktualisiert sie sich selbst.",
    linux2: "Ausführbar machen: Rechtsklick → Eigenschaften → „Ausführbar“ anhaken, oder im Terminal <code>chmod +x TradeLab_*.AppImage</code>.",
    linux3: "Per Doppelklick starten. Startet sie nicht, fehlt meist FUSE 2: Ubuntu/Debian <code>sudo apt install libfuse2</code> (ab Ubuntu 24.04 <code>libfuse2t64</code>), Fedora <code>sudo dnf install fuse-libs</code>, Arch <code>sudo pacman -S fuse2</code>.",
    linux4: "Alternativ das <b>.deb-Paket</b> mit <code>sudo apt install ./TradeLab_*.deb</code> installieren – dann gibt es aber keine automatischen Updates, neue Versionen holst du hier.",
    factsTitle: "Gut zu wissen",
    fact1: "Updates kommen automatisch in der App – du musst nie wieder etwas herunterladen.",
    fact2: "Jedes Update ist digital signiert und wird vor der Installation geprüft; vorher legt die App eine Sicherung an.",
    fact3: "Deine Daten bleiben lokal auf deinem Rechner. Keine Cloud, kein Konto nötig.",
    fact4: "Die KI läuft auf Wunsch lokal und kostenlos (Ollama) – ein Assistent in der App richtet sie ein.",
    footer: "TradeLab",
    allVersions: "Alle Versionen",
  },
  en: {
    tagline: "Trading journal with risk management – before the trade.",
    loading: "Loading current version …",
    version: (v, d) => `Current version ${v} · ${d}`,
    versionFail: "Could not load the version – the buttons lead to the release page.",
    fullTitle: "TradeLab",
    fullText: "The full version: starts empty, you create your own accounts and trades. No limit.",
    demoTitle: "TradeLab-Demo",
    demoText: "To try it out: over 1,000 sample trades are already included. Max. 10 new trades of your own per month.",
    winBtn: "⬇ Download for Windows",
    macBtn: "⬇ Download for macOS",
    linuxBtn: "⬇ Download for Linux (AppImage)",
    debLink: "or as a .deb package (Debian/Ubuntu, no auto-update)",
    soon: (os) => `The ${os} version is coming soon.`,
    docsTitle: "Guide",
    firstTitle: "First start",
    first1: "Double-click the downloaded file – no administrator rights needed.",
    first2: "If “Windows protected your PC” appears: click “More info” and then “Run anyway”. The warning appears because the app does not (yet) have a paid publisher certificate.",
    first3: "Done – start TradeLab from the Start menu. The guide explains what comes next.",
    linux1: "Put the <b>AppImage</b> in a permanent place, e.g. <code>~/Applications</code> – it updates itself from there.",
    linux2: "Make it executable: right-click → Properties → tick “Executable”, or in a terminal <code>chmod +x TradeLab_*.AppImage</code>.",
    linux3: "Double-click to start. If it does not start, FUSE 2 is usually missing: Ubuntu/Debian <code>sudo apt install libfuse2</code> (Ubuntu 24.04+ <code>libfuse2t64</code>), Fedora <code>sudo dnf install fuse-libs</code>, Arch <code>sudo pacman -S fuse2</code>.",
    linux4: "Alternatively install the <b>.deb package</b> with <code>sudo apt install ./TradeLab_*.deb</code> – but then there are no automatic updates; get new versions here.",
    factsTitle: "Good to know",
    fact1: "Updates arrive automatically in the app – you never have to download anything again.",
    fact2: "Every update is digitally signed and verified before installing; the app makes a backup first.",
    fact3: "Your data stays local on your computer. No cloud, no account required.",
    fact4: "The AI can run locally and for free (Ollama) – an in-app assistant sets it up.",
    footer: "TradeLab",
    allVersions: "All versions",
  },
};

let lang = "de";
try { lang = localStorage.getItem("tradelab.site.lang") || (navigator.language || "de").slice(0, 2); } catch {}
if (!T[lang]) lang = "en";
let os = /Linux|X11/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent) ? "linux" : "win";
let missing = [];
let release = null;
let failed = false;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = t[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  });
  // Nur eigene, feste Texte aus T (kein Fremdinhalt) → innerHTML ist hier unbedenklich.
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.os === os)));
  document.querySelectorAll("[data-os-box]").forEach((el) => { el.hidden = el.dataset.osBox !== os; });
  const soon = document.getElementById("soon-note");
  soon.hidden = !missing.length;
  if (missing.length) soon.textContent = t.soon(missing.join(" / "));
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const ver = document.getElementById("version");
  if (release) {
    const date = new Date(release.published_at).toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
      { day: "numeric", month: "long", year: "numeric" });
    ver.textContent = t.version(release.tag_name.replace(/^v/, ""), date);
  } else if (failed) {
    ver.textContent = t.versionFail;
  }
}

function link(id, assets, pattern) {
  const a = assets.find((x) => pattern.test(x.name));
  const el = document.getElementById(id);
  if (a) { el.href = a.browser_download_url; el.hidden = false; }
  return !!a;
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("tradelab.site.lang", lang); } catch {}
  render();
}));
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { os = b.dataset.os; render(); }));

render();
fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((rel) => {
    release = rel;
    const as = rel.assets || [];
    link("full-win", as, /^TradeLab_[\d.]+_x64-setup\.exe$/);
    link("demo-win", as, /^TradeLab-Demo_[\d.]+_x64-setup\.exe$/);
    const mac = link("full-mac", as, /^TradeLab_[\d.]+_(universal|aarch64|x64)\.dmg$/);
    link("demo-mac", as, /^TradeLab-Demo_[\d.]+_(universal|aarch64|x64)\.dmg$/);
    const linux = link("full-linux", as, /^TradeLab_[\d.]+_amd64\.AppImage$/);
    link("demo-linux", as, /^TradeLab-Demo_[\d.]+_amd64\.AppImage$/);
    link("full-deb", as, /^TradeLab_[\d.]+_amd64\.deb$/);
    link("demo-deb", as, /^TradeLab-Demo_[\d.]+_amd64\.deb$/);
    missing = [mac ? null : "macOS", linux ? null : "Linux"].filter(Boolean);
    render();
  })
  .catch(() => { failed = true; render(); });
</script>
</body>
</html>
